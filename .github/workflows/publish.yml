# This workflow will do a clean installation of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Test and publish

on:
  workflow_dispatch:
    inputs:
      run-tests:
        description: "Manual deployer for prod"
        required: false
        default: true
        type: boolean
  release:
    types:
      - released

jobs:
  quality:

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest, windows-latest]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        # vitest, @rollup/plugin-terser and @chromatic-com/storybook require Node.js >=20, and Node.js 20 is end-of-life

    steps:
      - name: Checkout Frontend Git Repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Packages
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'release' }}
    needs: [quality]
    # id-token lets npm authenticate this workflow via trusted publishing (OIDC), no npm token needed
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Frontend Git Repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Setup Node 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install Packages
        run: pnpm install --frozen-lockfile

      - name: Build npm package
        run: pnpm build-lib

      # staged publishing (npm >= 11.15.0, bundled with Node 24.x): the version goes live
      # only after a maintainer approves it with 2FA on npmjs.com (package page => Versions => Review it in Staged Packages)
      - name: Stage publish
        run: npm stage publish --access public
        working-directory: lib
